<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Return to FGM Hymnals • Official • MM to finish signing in." />
  <meta name="theme-color" content="#f7f8f6" />
  <meta property="og:title" content="Return to the app — FGM Hymnals • Official • MM" />
  <meta property="og:description" content="Your sign-in link was opened. Return to the app to continue." />
  <meta property="og:image" content="/logo.png" />
  <meta property="og:type" content="website" />
  <link rel="icon" href="/logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <title>Return to the app — FGM Hymnals • Official • MM</title>
</head>

<body class="page-auth">
  <div class="grain" aria-hidden="true"></div>

  <header class="top">
    <a class="brand-mark" href="/" aria-label="FGM Hymnals • Official • MM" data-i18n-aria-label="appName">
      <img src="/logo.png" width="36" height="36" alt="" />
      <span data-i18n="appName">FGM Hymnals • Official • MM</span>
    </a>
    <div class="top-actions">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" class="lang-btn is-active">EN</button>
        <button type="button" data-lang="fr" class="lang-btn">FR</button>
      </div>
    </div>
  </header>

  <main class="auth-complete">
    <div class="auth-complete-card">
      <img class="auth-complete-logo" src="/logo.png" width="72" height="72" alt="" />
      <h1 data-i18n="authCompleteTitle">Return to the app</h1>
      <p data-i18n="authCompleteBody">
        Your sign-in link was opened. Switch back to FGM Hymnals • Official • MM to continue.
      </p>
      <p class="auth-complete-links">
        <a href="/" data-i18n="backHome">Back to home</a>
        ·
        <a href="/privacy" data-i18n="privacy">Privacy Policy</a>
        ·
        <a href="/stats" data-i18n="stats">Stats</a>
      </p>
    </div>
  </main>

  <script src="/script.js" defer></script>
</body>

</html>
