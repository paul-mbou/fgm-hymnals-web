<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description"
    content="FGM Hymnals — the official Full Gospel Mission hymnbook. Lyrics, audio, sheet music and projection in French and English." />
  <meta name="theme-color" content="#141210" />
  <meta property="og:title" content="FGM Hymnals" />
  <meta property="og:description" content="Official FGM hymnbook for phone and tablet. French & English." />
  <meta property="og:image" content="/logo.png" />
  <meta property="og:type" content="website" />
  <link rel="icon" href="/logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <title>FGM Hymnals — Official</title>
</head>

<body class="page-lite">
  <div class="grain" aria-hidden="true"></div>

  <header class="top">
    <a class="brand-mark" href="/" aria-label="FGM Hymnals">
      <img src="/logo.png" width="36" height="36" alt="" />
      <span>FGM Hymnals</span>
    </a>
    <div class="top-actions">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" class="lang-btn is-active">EN</button>
        <button type="button" data-lang="fr" class="lang-btn">FR</button>
      </div>
    </div>
  </header>

  <main class="lite" id="top">
    <div class="lite-stage">
      <div class="lite-visual" aria-hidden="true">
        <div class="halo lite-halo"></div>
        <img class="lite-logo" src="/logo2.png" width="320" height="320" alt="" />
      </div>
      <div class="lite-copy">
        <p class="eyebrow" data-i18n="eyebrow">Official · MM</p>
        <h1>
          <span class="brand-line">FGM Hymnals</span>
        </h1>
        <p class="lede lite-lede" data-i18n="ledeLite">
          The Full Gospel Mission hymnbook — lyrics, audio, sheet music and
          projection, in French and English.
        </p>
        <div class="cta-row lite-cta" data-geo-cta>
          <a class="play-badge" href="https://play.google.com/store/apps/details?id=com.apps_industry.fgm_lyrics"
            rel="noopener noreferrer" aria-label="Get it on Google Play">
            <img class="play-badge-img" data-play-badge="en" src="/badges/google-play-en.png" width="215" height="83"
              alt="Get it on Google Play" />
            <img class="play-badge-img" data-play-badge="fr" src="/badges/google-play-fr.png" width="215" height="83"
              alt="Disponible sur Google Play" hidden />
            <span class="apk-download-btn" data-i18n="apkDownloadLabel" hidden>Download the app</span>
          </a>
        </div>
        <p class="lite-more">
          <a href="/full" data-i18n="seeMore">See features</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="foot foot-lite">
    <p>
      <span data-i18n="footerBrand">FGM Hymnals · Official · MM</span>
    </p>
    <p>
      <a href="/privacy" data-i18n="privacy">Privacy Policy</a>
    </p>
  </footer>

  <script src="/script.js" defer></script>
  <script src="/geo-cta.js" defer></script>
</body>

</html>
