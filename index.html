<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description"
    content="FGM Hymnals • Official • MM — the official Full Gospel Mission hymnbook. Lyrics, audio, sheet music and projection in French and English." />
  <meta name="theme-color" content="#f7f8f6" />
  <link rel="canonical" href="https://fgm-hymnals-web.vercel.app/" />
  <meta property="og:site_name" content="FGM Hymnals • Official • MM" />
  <meta property="og:url" content="https://fgm-hymnals-web.vercel.app/" />
  <meta property="og:title" content="FGM Hymnals • Official • MM" />
  <meta property="og:description"
    content="Official Full Gospel Mission hymnbook. Lyrics, audio, sheet music and projection — French & English." />
  <meta property="og:image" content="https://fgm-hymnals-web.vercel.app/og-cover-v2.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="FGM Hymnals — Official hymnbook for phone and tablet" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:locale:alternate" content="fr_FR" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="FGM Hymnals • Official • MM" />
  <meta name="twitter:description"
    content="Official Full Gospel Mission hymnbook. Lyrics, audio, sheet music and projection — French & English." />
  <meta name="twitter:image" content="https://fgm-hymnals-web.vercel.app/og-cover-v2.png" />
  <link rel="icon" href="/logo.png" type="image/png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <title>FGM Hymnals • Official • MM</title>
</head>

<body class="page-lite">
  <header class="top">
    <a class="brand-mark" href="/" aria-label="FGM Hymnals • Official • MM" data-i18n-aria-label="appName">
      <img src="/logo.png" width="34" height="34" alt="" />
      <span data-i18n="appName">FGM Hymnals • Official • MM</span>
    </a>
    <div class="top-actions">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" class="lang-btn is-active">EN</button>
        <button type="button" data-lang="fr" class="lang-btn">FR</button>
      </div>
    </div>
  </header>

  <main class="lite" id="top">
    <div class="lite-stage">
      <div class="lite-copy">
        <h1>
          <span class="brand-line" data-i18n="heroTitle">FGM Hymnals</span>
          <span class="hero-meta" data-i18n="eyebrow">Official · MM</span>
        </h1>
        <p class="lede lite-lede" data-i18n="ledeLite">
          The official Full Gospel Mission hymnbook — lyrics, audio, sheet music and
          projection.
        </p>
        <div class="cta-row lite-cta" data-geo-cta>
          <a class="play-badge" href="https://play.google.com/store/apps/details?id=com.apps_industry.fgm_lyrics"
            rel="noopener noreferrer" aria-label="Get it on Google Play">
            <img class="play-badge-img" data-play-badge="en" src="/badges/google-play-en.png" width="215" height="83"
              alt="Get it on Google Play" />
            <img class="play-badge-img" data-play-badge="fr" src="/badges/google-play-fr.png" width="215" height="83"
              alt="Disponible sur Google Play" hidden />
            <span class="apk-download-btn" data-i18n="apkDownloadLabel" hidden>Download the app</span>
          </a>
        </div>
        <p class="lite-more">
          <a href="/full" data-i18n="seeMore">See features</a>
        </p>
      </div>
      <div class="lite-visual">
        <figure class="phone-mock">
          <div class="phone-glow" aria-hidden="true"></div>
          <div class="phone-device">
            <span class="phone-btn phone-btn-silent" aria-hidden="true"></span>
            <span class="phone-btn phone-btn-vol-up" aria-hidden="true"></span>
            <span class="phone-btn phone-btn-vol-down" aria-hidden="true"></span>
            <span class="phone-btn phone-btn-power" aria-hidden="true"></span>
            <div class="phone-bezel">
              <div class="phone-screen">
                <img src="/app-screen-home.png" width="456" height="948" alt="FGM Hymnals — hymn list on phone" />
                <span class="phone-island" aria-hidden="true"></span>
              </div>
            </div>
          </div>
        </figure>
      </div>
    </div>
  </main>

  <footer class="foot foot-lite">
    <p>
      <span data-i18n="footerBrand">FGM Hymnals • Official • MM</span>
    </p>
    <p>
      <a href="/privacy" data-i18n="privacy">Privacy Policy</a>
      ·
      <a href="/stats" data-i18n="stats">Stats</a>
    </p>
  </footer>

  <script src="/script.js" defer></script>
  <script src="/geo-cta.js" defer></script>
</body>

</html>
